<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>프로젝트 일정관리</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
  * { box-sizing: border-box; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  body { margin: 0; background: #f8fafc; color: #111827; }

  .app-shell { display: flex; min-height: 100vh; }
  .sidebar { width: 200px; flex-shrink: 0; background: #111827; color: #d1d5db; padding: 16px 12px; }
  .sidebar-logo { font-size: 16px; font-weight: 700; color: #fff; padding: 8px 10px 20px; }
  .sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
  .sidebar-nav button { text-align: left; padding: 9px 10px; border: none; background: transparent; color: #d1d5db; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .sidebar-nav button:hover { background: #1f2937; }
  .sidebar-nav button.active { background: #2563eb; color: #fff; }
  .main-content { flex: 1; min-width: 0; padding: 20px 24px; }
  .main-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; }
  .main-header h1 { font-size: 19px; margin: 0 0 4px; }
  .main-sub { font-size: 13px; color: #6b7280; margin: 0; }
  .user-tag { font-size: 13px; color: #6b7280; }
  .online-users { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .online-pill { background: #dcfce7; color: #15803d; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 500; }
  .online-pill.dim { background: #f3f4f6; color: #9ca3af; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px 16px; }
  .stat-card .stat-label { font-size: 12px; color: #6b7280; display: block; margin-bottom: 6px; }
  .stat-card .stat-value { font-size: 24px; font-weight: 700; }
  .stat-card .stat-note { font-size: 11px; color: #9ca3af; margin-top: 4px; }
  .stat-card.red .stat-value { color: #dc2626; }

  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  .card h3 { font-size: 14px; margin: 0 0 12px; }
  .dash-row { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; align-items: start; }
  .donut-wrap { display: flex; align-items: center; gap: 18px; }
  .donut { width: 110px; height: 110px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .donut-hole { width: 68px; height: 68px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; }
  .donut-legend { font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
  .donut-legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }

  .recent-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .recent-table th, .recent-table td { border-bottom: 1px solid #f1f5f9; padding: 7px 8px; text-align: left; }
  .recent-table th { color: #6b7280; font-weight: 500; }
  .recent-table tbody tr { cursor: pointer; }
  .recent-table tbody tr:hover { background: #f8fafc; }

  .month-table { border-collapse: collapse; font-size: 12px; margin: 8px 0 0; width: 100%; }
  .month-table th, .month-table td { border: 1px solid #e5e7eb; padding: 4px 10px; text-align: right; }
  .month-table th { background: #f3f4f6; text-align: center; }
  .month-table td:first-child { text-align: center; }
  .rate-cell { display: flex; align-items: center; gap: 8px; }
  .rate-bar { flex: 1; min-width: 60px; background: #e5e7eb; border-radius: 4px; height: 8px; overflow: hidden; }
  .rate-bar-fill { background: #16a34a; height: 100%; }
  .rate-text { font-size: 12px; color: #111827; white-space: nowrap; }
  .year-nav { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 6px 0; }
  .year-nav button { border: 1px solid #d1d5db; background: #fff; border-radius: 6px; cursor: pointer; padding: 4px 10px; }

  .cal-header { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 8px 0; }
  .cal-header button { border: 1px solid #d1d5db; background: #fff; border-radius: 6px; cursor: pointer; padding: 4px 10px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); border: 1px solid #d1d5db; }
  .cal-dow { text-align: center; font-size: 12px; padding: 4px; background: #f3f4f6; border: 1px solid #e5e7eb; }
  .cal-cell { min-height: 90px; border: 1px solid #e5e7eb; padding: 4px; cursor: pointer; background: #fff; }
  .cal-cell.dim { background: #f9fafb; color: #9ca3af; }
  .cal-cell:hover { background: #eff6ff; }
  .cal-day { font-size: 12px; }
  .cal-task { display: block; width: 100%; text-align: left; font-size: 11px; margin-top: 2px; border: none; padding: 2px 4px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: 3px; color: #fff; }
  .cal-task.locked { opacity: .5; cursor: not-allowed; }

  .list-toolbar { display: flex; gap: 8px; margin: 8px 0; }
  .list-toolbar input, .list-toolbar select { padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; }
  .sheet-wrap { overflow-x: auto; border: 1px solid #d1d5db; }
  .sheet { border-collapse: collapse; font-size: 12px; white-space: nowrap; width: 100%; }
  .sheet th, .sheet td { border: 1px solid #e5e7eb; padding: 4px 8px; text-align: center; }
  .sheet tbody tr { cursor: pointer; background: #fff; }
  .sheet tbody tr:hover { background: #eff6ff; }
  .sheet tr.locked { opacity: .5; cursor: not-allowed; }
  .badge { color: #fff; padding: 1px 8px; border-radius: 4px; font-size: 11px; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 20px; }
  .modal { background: #fff; border-radius: 8px; padding: 20px; width: 640px; max-width: 92vw; max-height: 90vh; overflow-y: auto; }
  .modal h2 { margin-top: 0; font-size: 16px; }
  .modal h3 { font-size: 13px; margin: 16px 0 8px; padding-top: 12px; border-top: 1px solid #e5e7eb; color: #374151; }
  .modal h3:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
  .modal h3 .g-tag { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  .g-req .g-tag { background: #f59e0b; }
  .g-dev .g-tag { background: #2563eb; }
  .g-sched .g-tag { background: #a855f7; }
  .modal label { display: flex; flex-direction: column; font-size: 13px; gap: 4px; margin-bottom: 10px; }
  .modal .row { display: flex; gap: 8px; }
  .modal .row > label, .modal .row > div { flex: 1; }
  .modal input, .modal select, .modal textarea { padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
  .warning { color: #dc2626; font-size: 13px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .modal-actions button { padding: 7px 16px; border-radius: 6px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; }
  .modal-actions .primary { background: #2563eb; color: #fff; border-color: #2563eb; }
  .modal-actions .primary:disabled { background: #9ca3af; border-color: #9ca3af; cursor: not-allowed; }
  .modal-actions .danger { color: #dc2626; }

  .gantt-wrap { border: 1px solid #d1d5db; margin-top: 8px; }
  .gantt-table { display: grid; grid-template-columns: 180px 1fr; }
  .gantt-head-label { border-bottom: 1px solid #d1d5db; background: #f3f4f6; }
  .gantt-head-timeline { position: relative; height: 26px; border-bottom: 1px solid #d1d5db; background: #f3f4f6; }
  .gantt-tick { position: absolute; top: 4px; font-size: 10px; color: #9ca3af; }
  .gantt-row-label { padding: 5px 8px; font-size: 12px; border-bottom: 1px solid #e5e7eb; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .gantt-row-label .drag-handle { cursor: grab; color: #9ca3af; margin-right: 4px; }
  .gantt-row-label.drag-over { background: #eff6ff; box-shadow: inset 0 2px 0 #2563eb; }
  .gantt-row-label:hover { background: #eff6ff; }
  .gantt-row-timeline { position: relative; height: 28px; border-bottom: 1px solid #e5e7eb; }
  .gantt-bar { position: absolute; top: 4px; height: 20px; border-radius: 4px; color: #fff; font-size: 11px; padding: 0 6px; overflow: hidden; white-space: nowrap; cursor: pointer; }
  .gantt-today { position: absolute; top: 0; bottom: 0; width: 2px; background: #ef4444; z-index: 2; }
  .gantt-empty { padding: 24px; text-align: center; color: #9ca3af; font-size: 13px; }
  .gantt-month-row { display: contents; }
  .gantt-month-cell { text-align: center; font-size: 11px; font-weight: 600; color: #374151; background: #e5e7eb; border-left: 1px solid #d1d5db; padding: 3px 0; }
  .gantt-bar.unset { background: repeating-linear-gradient(45deg, #e5e7eb, #e5e7eb 6px, #f3f4f6 6px, #f3f4f6 12px); color: #9ca3af; border: 1px dashed #d1d5db; }
  .kpi-modal { width: 380px; }
  .kpi-modal .row2 { display: flex; gap: 8px; align-items: center; }
  .kpi-modal .row2 span { color: #9ca3af; }
</style>
</head>
<body>
<div id="root" class="app-shell"></div>

<script>
/* ===== Firebase 연결 ===== */
const firebaseConfig = {
  apiKey: "AIzaSyBw6k59Ji80jFOdENEY0CL1ozFJk844ZV0",
  authDomain: "project-scheduler-9720c.firebaseapp.com",
  projectId: "project-scheduler-9720c",
  storageBucket: "project-scheduler-9720c.firebasestorage.app",
  messagingSenderId: "452067963314",
  appId: "1:452067963314:web:35e34e6cd87d05d2fc34ab",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const tasksCol = db.collection("tasks");
const kpiCol = db.collection("kpiProjects");   // 간트차트 전용 (일정 목록/달력과 별개) - 프로젝트마다 여러 단계를 가짐
const presenceCol = db.collection("presence"); // 현재 접속 중인 사용자 표시용
const FIXED_GANTT_ITEMS = [
  "프로젝트 착수", "요구사항 분석 및 정의", "업무 정의 및 설계", "개발환경 분석 및 확정",
  "서비스 기능 정의", "화면설계", "개발", "테스트서버 검수", "오픈", "모니터링 및 오류 개선",
];

/* ===== 공통 상수 ===== */
const SERVICE_TYPES = ["UBMS", "SEM", "SMP", "HOME", "승인계", "BAT", "직접입력"];
const DEV_DEPTS = ["정보개발실", "승인개발실", "직접입력"];
const MEETING_VALUES = ["없음", "완료"];   // 요청협의/개발협의/업무설계/화면설계 공통
const CF_VALUES = ["N", "Y"];
const STATUS_VALUES = ["진행", "완료", "대기중"];
const STATUS_COLORS = { "진행": "#2563eb", "지연": "#dc2626", "완료": "#16a34a", "대기중": "#6b7280" };
const LOCK_TTL_MS = 60000;

// 사용자가 입력한 텍스트를 화면(innerHTML)에 표시할 때 악성 스크립트가 실행되지 않도록 이스케이프
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}
function fmt(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function dateDiffDays(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
function getMonthGrid(year, month) {
  const first = new Date(year, month, 1);
  const start = new Date(first);
  start.setDate(1 - first.getDay());
  return Array.from({ length: 42 }, (_, i) => {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    return { date: fmt(d), inMonth: d.getMonth() === month, day: d.getDate() };
  });
}

/* ===== 사용자 이름 ===== */
let userName = localStorage.getItem("scheduler_user");
if (!userName) {
  userName = prompt("이름을 입력해주세요 (일정 담당자 표시 및 편집자 구분에 사용됩니다)", "") || "익명";
  localStorage.setItem("scheduler_user", userName);
}

/* ===== 현재 접속 중인 사용자 표시 ===== */
let sessionId = localStorage.getItem("scheduler_session_id");
if (!sessionId) {
  sessionId = "sess_" + Math.random().toString(36).slice(2, 10);
  localStorage.setItem("scheduler_session_id", sessionId);
}
const PRESENCE_TTL_MS = 45000;
function pingPresence() {
  presenceCol.doc(sessionId).set({ name: userName, lastSeen: Date.now() }).catch(() => {});
}
pingPresence();
setInterval(pingPresence, 20000);
window.addEventListener("beforeunload", () => { presenceCol.doc(sessionId).delete().catch(() => {}); });
let onlineUsers = [];
presenceCol.onSnapshot((snap) => {
  onlineUsers = snap.docs
    .map((d) => d.data())
    .filter((u) => Date.now() - u.lastSeen < PRESENCE_TTL_MS);
  render();
});

/* ===== 전역 상태 ===== */
let tasks = [];
let tab = localStorage.getItem("scheduler_tab") || "dashboard";
let now = new Date();
let ym = { year: now.getFullYear(), month: now.getMonth() };
let calendarBasis = "req";   // 달력 조회 기준: "req"=요청일자, "apply"=적용일자
let summaryYear = now.getFullYear();   // 대시보드 월별 집계표에서 조회 중인 연도
let statusAsOfDate = null;   // "최근 개선 현황" 기준 시점(YYYY-MM-DD). null이면 오늘 기준
let ganttYear = now.getFullYear();     // 장기 프로젝트 관리 탭에서 조회 중인 연도
let modal = null;
let kpiProjects = [];   // [{ id, name, stages: [{label, kpiName, start, end}, ...] }, ...]
let kpiModal = null;    // { projectId, stageIdx }
let newProjectModal = false;   // 새 프로젝트 추가 팝업 (프로젝트명 + 기본단계 일자)
let statusDetailPopup = null;   // { label, kind: "progress"|"done", tasks: [...] } - 대시보드 "최근 개선 현황" 행 클릭 시 상세 목록 팝업
let listFilter = { status: "전체", keyword: "" };
let listYear = "전체";
let listPage = 1;
let selectedTaskIds = new Set();
const LIST_PAGE_SIZE = 50;

/* ===== Firestore 실시간 구독 =====
   중요: 구독이 실패해도(예: 보안 규칙 만료로 권한 거부) 절대 tasks/kpiProjects를 비우지 않는다.
   화면이 "데이터가 없어짐"처럼 보이는 것을 막고, 대신 명확한 오류 배너를 띄운다. */
let tasksLoaded = false;
let kpiLoaded = false;
let dbError = null;   // { code, message } - 하나라도 나면 배너로 표시

tasksCol.onSnapshot(
  (snap) => {
    tasks = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    tasksLoaded = true;
    if (dbError && dbError.source === "tasks") dbError = null;
    render();
  },
  (err) => {
    // tasks는 절대 덮어쓰지 않음(마지막으로 불러온 값 유지) - 실제 데이터 손실처럼 보이는 것을 방지
    dbError = { source: "tasks", code: err.code, message: err.message };
    render();
  }
);
kpiCol.onSnapshot(
  (snap) => {
    kpiProjects = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    kpiLoaded = true;
    if (dbError && dbError.source === "kpi") dbError = null;
    render();
  },
  (err) => {
    dbError = { source: "kpi", code: err.code, message: err.message };
    render();
  }
);

// 이전 버전(고정 10단계, 프로젝트 개념 없음)으로 등록해둔 데이터가 있으면 1회만 새 구조로 옮겨줌
(async () => {
  const cur = await kpiCol.limit(1).get();
  if (!cur.empty) return;
  const legacySnap = await db.collection("kpiPlan").get();
  if (legacySnap.empty) return;
  const legacy = {};
  legacySnap.docs.forEach((d) => { legacy[d.id] = d.data(); });
  const stages = FIXED_GANTT_ITEMS.map((label, idx) => ({
    label, kpiName: "", start: legacy[idx]?.start || "", end: legacy[idx]?.end || "",
  }));
  await kpiCol.add({ name: "KPI 프로젝트", stages, createdAt: Date.now() });
})();

/* ===== 편집 잠금 ===== */
let lockHeartbeat = null;
function isLocked(task) {
  return task.editingBy && task.editingBy !== userName && task.editingAt &&
    (Date.now() - task.editingAt) < LOCK_TTL_MS;
}
async function acquireLock(task) {
  const fresh = tasks.find((t) => t.id === task.id);
  if (fresh && isLocked(fresh)) return false;
  await tasksCol.doc(task.id).update({ editingBy: userName, editingAt: Date.now() });
  startLockHeartbeat(task.id);
  return true;
}
async function releaseLock(taskId) {
  stopLockHeartbeat();
  await tasksCol.doc(taskId).update({ editingBy: firebase.firestore.FieldValue.delete(), editingAt: firebase.firestore.FieldValue.delete() });
}
function startLockHeartbeat(taskId) {
  stopLockHeartbeat();
  lockHeartbeat = setInterval(() => {
    tasksCol.doc(taskId).update({ editingAt: Date.now() }).catch(() => {});
  }, 20000);
}
function stopLockHeartbeat() {
  if (lockHeartbeat) { clearInterval(lockHeartbeat); lockHeartbeat = null; }
}

/* ===== 대시보드 집계 (월 귀속 기준: 요청일자) ===== */
function computeDashboard() {
  const byMonth = {};
  tasks.forEach((t) => {
    const key = t.reqDate ? t.reqDate.slice(0, 7) : null;
    if (!key) return;
    const m = (byMonth[key] ??= { requested: 0, inProgress: 0, delayed: 0, done: 0 });
    m.requested++;
    if (t.status === "완료") m.done++;
    else { m.inProgress++; if (t.status === "지연") m.delayed++; }
  });
  const monthly = Object.entries(byMonth).sort(([a], [b]) => a.localeCompare(b)).map(([month, m]) => ({
    month, ...m,
    doneRate: m.requested ? Math.round((m.done / m.requested) * 100) : 0,
    progressRate: m.requested ? Math.round((m.inProgress / m.requested) * 100) : 0,
  }));
  const nowKey = new Date().toISOString().slice(0, 7);
  const thisMonth = monthly.find((m) => m.month === nowKey) ??
    { month: nowKey, requested: 0, inProgress: 0, delayed: 0, done: 0, doneRate: 0, progressRate: 0 };
  return { thisMonth, monthly };
}

// 완료여부 판정 공용 함수 - "완료"이고 적용일자가 기준일 이전이어야 그 시점 기준 완료로 인정
function isTaskDoneAsOf(t, asOf) {
  return (t.status || "").trim() === "완료" && t.applyDate && t.applyDate <= asOf;
}
// 주간보고 엑셀의 "최근 개선 현황 (KPI제외)" 표와 동일한 로직 - 대시보드 화면에서도 재사용
// asOfDate("YYYY-MM-DD")를 넘기면 그 시점 기준으로 계산: 해당 날짜 이후 접수된 건은 제외하고,
// 완료여부는 "적용일자가 기준일 이전인 완료건만 완료로 집계"하는 방식으로 과거 시점 현황을 재구성한다.
function computeRecentImprovementStatus(asOfDate) {
  const asOf = asOfDate || fmt(new Date());
  const nonKpiTasks = tasks.filter((t) => (t.docNo || "").trim().toUpperCase() !== "KPI" && t.reqDate && t.reqDate <= asOf);
  const isDoneAsOf = (t) => isTaskDoneAsOf(t, asOf);
  function lastNMonthKeys(n) {
    const arr = [];
    const [ay, am] = asOf.split("-").map(Number);
    for (let i = 0; i < n; i++) {
      const d = new Date(ay, am - 1 - i, 1);
      arr.unshift(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
    }
    return arr;
  }
  function monthKeyAddOffset(key, offset) {
    const [y, m] = key.split("-").map(Number);
    const d = new Date(y, m - 1 + offset, 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
  }
  const byMonth = {};
  nonKpiTasks.forEach((t) => {
    const key = t.reqDate.slice(0, 7);
    const m = (byMonth[key] ??= { requested: 0, inProgress: 0, done: 0, tasks: [] });
    m.requested++;
    if (isDoneAsOf(t)) m.done++; else m.inProgress++;
    m.tasks.push(t);
  });
  function monthHasInProgress(key) {
    return nonKpiTasks.some((t) => t.reqDate.slice(0, 7) === key && !isDoneAsOf(t));
  }
  let keys = lastNMonthKeys(3);
  for (let guard = 0; guard < 36; guard++) {
    const prevKey = monthKeyAddOffset(keys[0], -1);
    if (monthHasInProgress(prevKey)) keys.unshift(prevKey);
    else break;
  }
  const rows = keys.map((key) => {
    const m = byMonth[key] || { requested: 0, inProgress: 0, done: 0, tasks: [] };
    const rate = m.requested ? Math.round((m.done / m.requested) * 100) : 0;
    return { key, label: `${key.slice(0, 4)}년 ${Number(key.slice(5, 7))}월`, requested: m.requested, inProgress: m.inProgress, done: m.done, rate, tasks: m.tasks };
  });
  const curYear = asOf.slice(0, 4);
  const yearTasks = nonKpiTasks.filter((t) => t.reqDate.slice(0, 4) === curYear);
  const yReq = yearTasks.length;
  const yDone = yearTasks.filter((t) => isDoneAsOf(t)).length;
  const yProg = yReq - yDone;
  const yRate = yReq ? Math.round((yDone / yReq) * 100) : 0;
  const cumulative = { label: `${curYear}년 누적`, requested: yReq, inProgress: yProg, done: yDone, rate: yRate, tasks: yearTasks };
  return { rows, cumulative, asOf };
}

/* ===== 엑셀 일괄등록 ===== */
const IMPORT_COLUMN_MAP = {
  "요청일자": "reqDate", "요청부서": "reqDept", "요청자": "requester", "요청협의": "reqMeeting",
  "요청사항": "reqContent", "관련 문서번호": "docNo", "서비스 코드": "serviceCode", "서비스구분": "service",
  "서비스명": "serviceName", "개발부서": "devDept", "개발협의": "devMeeting", "업무설계": "workDesign",
  "화면설계": "screenDesign", "CF요청": "cfRequest", "CF번호": "cfNo", "CF요청일자": "cfDate",
  "협의일자": "meetingDate", "적용일자": "applyDate", "완료여부": "status", "비고": "memo",
};
function excelDateToStr(v) {
  if (v === undefined || v === null || v === "") return "";
  if (v instanceof Date) {
    // SheetJS가 cellDates 옵션으로 만든 Date는 UTC 기준으로 생성되므로 UTC getter로 읽어야 함
    return `${v.getUTCFullYear()}-${String(v.getUTCMonth() + 1).padStart(2, "0")}-${String(v.getUTCDate()).padStart(2, "0")}`;
  }
  if (typeof v === "number") {
    const d = XLSX.SSF.parse_date_code(v);
    if (!d) return "";
    return `${d.y}-${String(d.m).padStart(2, "0")}-${String(d.d).padStart(2, "0")}`;
  }
  const s = String(v).trim();
  const m = s.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  return m ? `${m[1]}-${String(m[2]).padStart(2, "0")}-${String(m[3]).padStart(2, "0")}` : s;
}
function normHeader(s) { return String(s).replace(/\s+/g, ""); }
const NORM_IMPORT_MAP = {};
Object.entries(IMPORT_COLUMN_MAP).forEach(([k, v]) => { NORM_IMPORT_MAP[normHeader(k)] = v; });
function taskSignature(rec) {
  // 관련 문서번호는 실제 데이터에서 '내부개선', 'KPI'처럼 분류 태그로 재사용되는 경우가 많아
  // 고유 식별자로 신뢰할 수 없음 - 여러 항목을 조합해서 중복 여부를 판단
  return `${rec.reqDate || ""}|${rec.reqDept || ""}|${rec.requester || ""}|${rec.title || ""}|${rec.serviceCode || ""}`;
}
function buildEffectiveHeader(rows, headerRowIdx) {
  const headerRow = rows[headerRowIdx];
  return headerRow.map((cell, colIdx) => {
    if (String(cell).trim()) return cell;
    for (let r = headerRowIdx - 1; r >= 0; r--) {
      const v = rows[r]?.[colIdx];
      if (v && String(v).trim()) return v;
    }
    return cell;
  });
}
function extractRecordsFromSheet(sheet) {
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
  const headerRowIdx = rows.findIndex((r) => r.some((c) => normHeader(c) === "요청일자"));
  if (headerRowIdx === -1) return [];
  const headerRow = buildEffectiveHeader(rows, headerRowIdx);
  const dataRows = rows.slice(headerRowIdx + 1).filter((r) => r.some((c) => c !== ""));

  return dataRows.map((row) => {
    const rec = {};
    headerRow.forEach((h, i) => {
      const key = NORM_IMPORT_MAP[normHeader(h)];
      if (key) rec[key] = row[i] ?? "";
    });
    if (!rec.reqDate && !rec.serviceName && !rec.reqContent) return null;
    const dateFields = ["reqDate", "cfDate", "meetingDate", "applyDate"];
    dateFields.forEach((k) => { if (rec[k]) rec[k] = excelDateToStr(rec[k]); });
    Object.keys(rec).forEach((k) => {
      if (dateFields.includes(k)) return;
      if (typeof rec[k] === "number") rec[k] = String(rec[k]);
      if (typeof rec[k] === "string") rec[k] = rec[k].trim();
    });
    rec.title = rec.serviceName || rec.reqContent || "제목없음";
    rec.reqMeeting = rec.reqMeeting || "없음";
    rec.devMeeting = rec.devMeeting || "없음";
    rec.workDesign = rec.workDesign || "없음";
    rec.screenDesign = rec.screenDesign || "없음";
    rec.cfRequest = rec.cfRequest || "N";
    // 완료여부는 엑셀에 값이 있으면 그 값을 그대로 존중한다.
    // 엑셀에 완료여부가 비어있을 때만 자동 판단: 요청일자/적용일자가 없으면 "대기중", 있으면 "진행"
    if (!rec.status) rec.status = (!rec.reqDate || !rec.applyDate) ? "대기중" : "진행";
    return rec;
  }).filter(Boolean);
}
async function deleteSelectedTasks() {
  const targets = tasks.filter((t) => selectedTaskIds.has(t.id));
  if (targets.length === 0) { alert("삭제할 일정을 선택해주세요."); return; }
  if (!confirm(`선택한 일정 ${targets.length}건을 삭제할까요?\n이 작업은 되돌릴 수 없습니다.`)) return;
  const CHUNK = 400;
  for (let i = 0; i < targets.length; i += CHUNK) {
    const batch = db.batch();
    targets.slice(i, i + CHUNK).forEach((t) => batch.delete(tasksCol.doc(t.id)));
    await batch.commit();
  }
  selectedTaskIds.clear();
  alert(`${targets.length}건을 삭제했습니다.`);
}
async function handleImportFile(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array" });

  let allRecs = [];
  wb.SheetNames.forEach((name) => { allRecs = allRecs.concat(extractRecordsFromSheet(wb.Sheets[name])); });
  if (allRecs.length === 0) { alert("엑셀 안에서 '요청일자' 컬럼을 찾지 못했어요. 파일 형식을 확인해주세요."); return; }

  // 식별자(요청일자+요청부서+요청자+일정명+서비스코드)로 기존 일정을 매핑해두고,
  // 같은 일정이 발견되면 완료여부/적용일자 등 달라진 항목만 골라 기존 일정을 업데이트한다.
  const existingBySig = new Map();
  tasks.forEach((t) => existingBySig.set(taskSignature(t), t));

  const toAdd = [];
  const toUpdate = [];   // [{ id, data }]
  let unchanged = 0;

  allRecs.forEach((rec) => {
    const sig = taskSignature(rec);
    const matched = existingBySig.get(sig);

    if (matched && matched.__pendingAdd) {
      // 이번 파일 안에서 같은 일정이 여러 번 나온 경우 - 새로 등록 예정인 레코드에 최신 값을 덮어씀
      Object.assign(matched, rec);
      return;
    }
    if (matched) {
      // 이미 등록된 일정 - 값이 달라진 항목만 뽑아 업데이트 대상으로
      const diff = {};
      Object.keys(rec).forEach((k) => {
        if (String(rec[k] ?? "") !== String(matched[k] ?? "")) diff[k] = rec[k];
      });
      if (Object.keys(diff).length > 0) {
        let entry = toUpdate.find((u) => u.id === matched.id);
        if (!entry) { entry = { id: matched.id, data: {} }; toUpdate.push(entry); }
        Object.assign(entry.data, diff);
        Object.assign(matched, diff);   // 로컬 비교 기준값도 갱신(같은 파일 내 후속 중복 대비)
      } else {
        unchanged++;
      }
      return;
    }
    const newRec = { ...rec, __pendingAdd: true };
    toAdd.push(newRec);
    existingBySig.set(sig, newRec);
  });

  const CHUNK = 400;   // Firestore 배치는 최대 500건, 여유있게 400건씩 나눠 커밋
  for (let i = 0; i < toAdd.length; i += CHUNK) {
    const batch = db.batch();
    toAdd.slice(i, i + CHUNK).forEach((rec) => {
      const { __pendingAdd, ...data } = rec;
      batch.set(tasksCol.doc(), data);
    });
    await batch.commit();
  }
  for (let i = 0; i < toUpdate.length; i += CHUNK) {
    const batch = db.batch();
    toUpdate.slice(i, i + CHUNK).forEach((u) => batch.update(tasksCol.doc(u.id), u.data));
    await batch.commit();
  }

  const parts = [`${toAdd.length}건 신규 등록`];
  if (toUpdate.length > 0) parts.push(`${toUpdate.length}건 정보 갱신(업데이트)`);
  if (unchanged > 0) parts.push(`${unchanged}건은 변동사항 없어 그대로 둠`);
  alert(parts.join(", ") + "했습니다.");
}

/* ===== IME(한글 등) 조합 중 재렌더링으로 입력이 끊기는 문제 방지 =====
   document에 한 번만 붙여서, #root 내부가 통째로 교체돼도 계속 유지되도록 함 */
let globalIsComposing = false;
document.addEventListener("compositionstart", () => { globalIsComposing = true; });
document.addEventListener("compositionend", () => { globalIsComposing = false; });

function render() {
  if (globalIsComposing) return;   // 조합 중에는 DOM을 건드리지 않음 (조합 끝나면 위 리스너가 다시 render 호출)
  const activeEl = document.activeElement;
  const focusInfo = (activeEl && activeEl.id && document.getElementById("root")?.contains(activeEl))
    ? { id: activeEl.id, start: activeEl.selectionStart, end: activeEl.selectionEnd }
    : null;

  // 팝업이 열려있는 동안 다른 사람의 변경사항 등으로 인한 재렌더링이 일어나도,
  // 아직 저장하지 않은 입력값이 지워지지 않도록 현재 입력값을 미리 스냅샷으로 저장
  const MODAL_FIELD_IDS = ["f_title","f_reqDept","f_requester","f_reqDate","f_reqMeeting","f_reqContent","f_docNo",
    "f_serviceCode","f_serviceName","f_service","f_serviceCustom","f_devDept","f_devDeptCustom","f_devMeeting",
    "f_workDesign","f_screenDesign","f_cfRequest","f_cfNo","f_cfDate","f_meetingDate","f_applyDate","f_status","f_memo"];
  const KPI_FIELD_IDS = ["k_label", "k_kpiName", "k_start", "k_end"];
  const fieldDraft = {};
  if (modal) MODAL_FIELD_IDS.forEach((id) => { const el = document.getElementById(id); if (el) fieldDraft[id] = el.value; });
  if (kpiModal) KPI_FIELD_IDS.forEach((id) => { const el = document.getElementById(id); if (el) fieldDraft[id] = el.value; });
  if (newProjectModal) document.querySelectorAll('[id^="np_"]').forEach((el) => { fieldDraft[el.id] = el.value; });

  // 팝업 편집 중(잠금 하트비트, 접속자 표시 등으로) 20초마다 화면이 통째로 다시 그려지면서
  // 팝업 내부 스크롤이 맨 위로 튕겨 올라가는 문제 방지 - 스크롤 위치를 기억했다가 그대로 복원
  const modalScrollTop = document.getElementById("modalBox")?.scrollTop;
  const pageScrollY = window.scrollY;

  const root = document.getElementById("root");
  root.innerHTML = `
    <aside class="sidebar">
      <div class="sidebar-logo">프로젝트 일정관리</div>
      <nav class="sidebar-nav">
        <button data-tab="dashboard" class="${tab === "dashboard" ? "active" : ""}">대시보드</button>
        <button data-tab="list" class="${tab === "list" ? "active" : ""}">일정 목록</button>
        <button data-tab="gantt" class="${tab === "gantt" ? "active" : ""}">장기 프로젝트 관리</button>
        <button data-tab="calendar" class="${tab === "calendar" ? "active" : ""}">달력</button>
      </nav>
    </aside>
    <main class="main-content">
      <header class="main-header">
        <div>
          <h1>${tab === "dashboard" ? "대시보드" : tab === "calendar" ? "달력" : tab === "gantt" ? "장기 프로젝트 관리" : "일정 목록"}</h1>
          <p class="main-sub">${fmt(new Date())} 기준</p>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
          <div class="online-users" title="현재 접속 중">
            ${onlineUsers.map((u) => `<span class="online-pill">${esc(u.name)}</span>`).join("") || `<span class="online-pill dim">접속자 없음</span>`}
          </div>
          <span class="user-tag">${esc(userName)} 님</span>
        </div>
      </header>
      ${dbError ? `
        <div style="background:#fef2f2; border:1px solid #fca5a5; color:#991b1b; border-radius:8px; padding:14px 16px; margin-bottom:16px; line-height:1.6;">
          <strong>⚠ 데이터를 서버에서 불러오지 못하고 있어요 (${esc(dbError.code || "오류")})</strong><br/>
          지금 화면에 일정이 없거나 이상하게 보여도 <u>실제로 데이터가 삭제된 것이 아닐 가능성이 높습니다.</u>
          대부분 Firebase 보안 규칙(테스트 모드) 만료로 접근이 막힌 경우입니다.<br/>
          Firebase 콘솔 → Firestore Database → 규칙 탭에서 만료일을 확인하고 규칙을 갱신해주세요.
        </div>
      ` : (!tasksLoaded ? `
        <div style="background:#eff6ff; border:1px solid #bfdbfe; color:#1e40af; border-radius:8px; padding:10px 16px; margin-bottom:16px;">
          데이터를 불러오는 중입니다...
        </div>
      ` : "")}
      <input type="file" id="importFile" accept=".xlsx,.xls" style="display:none;" />
      <div id="tabContent"></div>
      ${modal ? renderModal() : ""}
      ${kpiModal ? renderKpiModal() : ""}
      ${newProjectModal ? renderNewProjectModal() : ""}
      ${statusDetailPopup ? renderStatusDetailModal() : ""}
    </main>
  `;

  document.querySelectorAll(".sidebar-nav button").forEach((b) => b.onclick = () => {
    tab = b.dataset.tab;
    localStorage.setItem("scheduler_tab", tab);
    window.scrollTo(0, 0);
    render();
  });

  const tabRoot = document.getElementById("tabContent");
  if (tab === "dashboard") tabRoot.innerHTML = renderDashboard();
  else if (tab === "calendar") tabRoot.innerHTML = renderCalendar();
  else if (tab === "gantt") tabRoot.innerHTML = renderGantt();
  else tabRoot.innerHTML = renderList();

  bindTabEvents();
  if (modal) bindModalEvents();
  if (kpiModal) bindKpiModalEvents();
  if (newProjectModal) bindNewProjectModalEvents();
  if (statusDetailPopup) bindStatusDetailModalEvents();

  Object.entries(fieldDraft).forEach(([id, val]) => {
    const el = document.getElementById(id);
    if (el && el.value !== val) {
      el.value = val;
      if (id === "f_service" || id === "f_devDept") el.dispatchEvent(new Event("change"));
    }
  });

  if (focusInfo) {
    const el = document.getElementById(focusInfo.id);
    if (el) {
      el.focus();
      if (typeof focusInfo.start === "number" && el.setSelectionRange) {
        try { el.setSelectionRange(focusInfo.start, focusInfo.end); } catch (e) {}
      }
    }
  }
  maybeRestoreScroll();

  // 팝업(모달) 내부 스크롤 및 페이지 스크롤 위치 복원
  if (modal && typeof modalScrollTop === "number") {
    const mb = document.getElementById("modalBox");
    if (mb) mb.scrollTop = modalScrollTop;
  }
  if (pageScrollY > 0) window.scrollTo(0, pageScrollY);
}

function statCard(label, value, red, note) {
  return `<div class="stat-card ${red ? "red" : ""}"><span class="stat-label">${label}</span><span class="stat-value">${value}</span>${note ? `<div class="stat-note">${note}</div>` : ""}</div>`;
}

function renderDashboard() {
  const { thisMonth, monthly } = computeDashboard();
  const monthlyForYear = monthly.filter((m) => m.month.slice(0, 4) === String(summaryYear));

  const doneCount = tasks.filter((t) => t.status === "완료").length;
  const progressCount = tasks.filter((t) => t.status === "진행").length;
  const total = tasks.length;
  const donePct = total ? Math.round((doneCount / total) * 100) : 0;
  const doneDeg = total ? (doneCount / total) * 360 : 0;
  const gradient = total
    ? `conic-gradient(#16a34a 0deg ${doneDeg}deg, #2563eb ${doneDeg}deg 360deg)`
    : "#e5e7eb";

  const recent = [...tasks].sort((a, b) => (b.reqDate || "").localeCompare(a.reqDate || "")).slice(0, 8);
  const recentStatus = computeRecentImprovementStatus(statusAsOfDate || null);

  return `

      ${statCard("진행중", thisMonth.inProgress + "건", thisMonth.delayed > 0, `지연 ${thisMonth.delayed}건 포함`)}
      ${statCard("완료건", thisMonth.done + "건", false, `완료율 ${thisMonth.doneRate}%`)}

        <div class="year-nav" style="justify-content:space-between; margin:0 0 10px;">

        <table class="month-table">

function renderCalendar() {
  const grid = getMonthGrid(ym.year, ym.month);
  const dows = ["일","월","화","수","목","금","토"];
  const dateField = calendarBasis === "apply" ? "applyDate" : "reqDate";
  const byDate = {};
  tasks.forEach((t) => {
    const d = t[dateField];
    if (d) (byDate[d] ??= []).push({ task: t, upcoming: false });
  });
  // 적용일자 기준으로 조회 중일 때, 완료여부 "진행"인 일정은 협의일자에도
  // "적용 예정 일정"으로 주황색 표시를 추가한다(기존 적용일자 표시는 그대로 유지)
  if (calendarBasis === "apply") {
    tasks.forEach((t) => {
      if (t.status === "진행" && t.meetingDate) {
        (byDate[t.meetingDate] ??= []).push({ task: t, upcoming: true });
      }
    });
  }
  return `
    <header class="cal-header">
      <button id="prevM">◀</button>
      <strong>${ym.year}년 ${ym.month + 1}월</strong>
      <button id="nextM">▶</button>
    </header>
    <div style="display:flex; justify-content:center; align-items:center; gap:14px; margin:6px 0;">
      <label style="font-size:12px; color:#6b7280; display:flex; align-items:center; gap:6px;">조회 기준
        <select id="calBasisFilter">
          <option value="req" ${calendarBasis === "req" ? "selected" : ""}>요청일자 기준</option>
          <option value="apply" ${calendarBasis === "apply" ? "selected" : ""}>적용일자 기준</option>
        </select>
      </label>
      <span style="font-size:12px; color:#6b7280;">
        <span style="display:inline-block; width:9px; height:9px; border-radius:2px; background:#2563eb; margin-right:4px;"></span>진행중인 일정
        &nbsp;&nbsp;
        <span style="display:inline-block; width:9px; height:9px; border-radius:2px; background:#16a34a; margin-right:4px;"></span>완료된 일정
        ${calendarBasis === "apply" ? `
        &nbsp;&nbsp;
        <span style="display:inline-block; width:9px; height:9px; border-radius:2px; background:#f97316; margin-right:4px;"></span>적용 예정 일정(협의일자)
        ` : ""}
      </span>
    </div>
    <div class="cal-grid">
      ${dows.map((d) => `<div class="cal-dow">${d}</div>`).join("")}

          `).join("")}

}

function renderOneGantt(project, year) {
  const stages = project.stages || [];
  const today = fmt(new Date());
  const rangeStart = `${year}-01-01`;
  const rangeEnd = `${year}-12-31`;
  const totalDays = dateDiffDays(rangeStart, rangeEnd) + 1;
  const weekCount = Math.ceil(totalDays / 7);
  const gridDays = weekCount * 7;

  const weeks = Array.from({ length: weekCount }, (_, i) => {
    const d = new Date(rangeStart);
    d.setDate(d.getDate() + i * 7);
    return { idx: i + 1, month: d.getMonth() + 1 };
  });
  const monthGroups = [];
  weeks.forEach((w) => {
    const last = monthGroups[monthGroups.length - 1];
    if (last && last.month === w.month) last.count++;
    else monthGroups.push({ month: w.month, count: 1 });
  });

  const todayInRange = today >= rangeStart && today <= rangeEnd;
  const todayLeft = todayInRange ? dateDiffDays(rangeStart, today) / gridDays * 100 : null;
  const todayLine = todayLeft !== null ? `<div class="gantt-today" style="left:${todayLeft}%;"></div>` : "";

  const rows = stages.map((item, idx) => {
    const hasRange = item.start && item.end;
    const labelHtml = `${esc(item.label)}${item.kpiName ? `<br><span style="color:#6b7280; font-weight:400;">KPI: ${esc(item.kpiName)}</span>` : ""}`;
    let bar = "";
    if (hasRange) {
      const clipStart = item.start < rangeStart ? rangeStart : item.start;
      const clipEnd = item.end > rangeEnd ? rangeEnd : item.end;
      if (clipStart <= clipEnd) {
        const left = dateDiffDays(rangeStart, clipStart) / gridDays * 100;
        const width = Math.max((dateDiffDays(clipStart, clipEnd) + 1) / gridDays * 100, 100 / gridDays);
        bar = `<div class="gantt-bar" data-project="${project.id}" data-idx="${idx}" style="left:${left}%; width:${width}%; background:#2563eb;" title="${item.label} (${item.start} ~ ${item.end})">${item.label}</div>`;
      }
    } else {
      bar = `<div class="gantt-bar unset" data-project="${project.id}" data-idx="${idx}" style="left:0; width:100%;" title="클릭해서 기간을 설정하세요">기간 미설정 (클릭해서 설정)</div>`;
    }
    return `
      <div class="gantt-row-label" draggable="true" data-project="${project.id}" data-idx="${idx}">
        <span class="drag-handle" title="끌어서 순서 변경">⠿</span>
        <span>${labelHtml}</span>
        <button class="insertStageBtn" data-project="${project.id}" data-idx="${idx}" title="이 단계 다음에 새 단계 추가" style="float:right; width:18px; height:18px; line-height:16px; padding:0; border:1px solid #d1d5db; border-radius:4px; background:#fff; cursor:pointer; font-size:12px;">+</button>
      </div>
      <div class="gantt-row-timeline">${todayLine}${bar}</div>`;
  }).join("");

  return `
    <div class="gantt-project" style="margin-bottom:24px;">
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
        <h3 style="font-size:14px; margin:0;">${esc(project.name)}</h3>
        <button class="renameProjectBtn" data-project="${project.id}" title="프로젝트 이름 수정" style="padding:3px 8px; font-size:12px; border:1px solid #d1d5db; border-radius:6px; background:#fff; cursor:pointer;">✎ 이름 수정</button>
        <button class="deleteProjectBtn" data-project="${project.id}" title="프로젝트 삭제" style="padding:3px 8px; font-size:12px; border:1px solid #dc2626; color:#dc2626; border-radius:6px; background:#fff; cursor:pointer;">삭제</button>
      </div>
      <div class="gantt-wrap">
        <div class="gantt-table" style="grid-template-rows: 20px 24px repeat(${stages.length}, 34px);">
          <div class="gantt-head-label" style="grid-row: span 2;"></div>
          <div class="gantt-month-row" style="display:grid; grid-template-columns: repeat(${weekCount}, 1fr);">
            ${monthGroups.map((g) => `<div class="gantt-month-cell" style="grid-column: span ${g.count};">${g.month}월</div>`).join("")}
          </div>
          <div class="gantt-head-timeline" style="display:grid; grid-template-columns: repeat(${weekCount}, 1fr);">
            ${weeks.map((w) => `<div class="gantt-tick" style="position:static; text-align:center; border-left:1px solid #e5e7eb;">${w.idx}W</div>`).join("")}
          </div>
          ${rows || `<div class="gantt-empty" style="grid-column:1/3;">단계가 없습니다. "+ 단계 추가"를 눌러주세요.</div>`}
        </div>
      </div>
    </div>`;
}

function projectDateRange(project) {
  const stages = project.stages || [];
  const starts = stages.map((s) => s.start).filter(Boolean).sort();
  const ends = stages.map((s) => s.end).filter(Boolean).sort();
  const namedStart = stages.find((s) => s.label === "프로젝트 착수")?.start;
  const namedEnd = stages.find((s) => s.label === "오픈")?.end;
  return { start: namedStart || starts[0] || "", end: namedEnd || ends[ends.length - 1] || "" };
}
function projectOverlapsYear(project, year) {
  const { start, end } = projectDateRange(project);
  if (!start && !end) return true;   // 기간이 아예 없으면 현재 연도에는 노출(설정 유도)
  const s = start || end, e = end || start;
  return s <= `${year}-12-31` && e >= `${year}-01-01`;
}

function renderGantt() {
  const sortedProjects = [...kpiProjects]
    .filter((p) => projectOverlapsYear(p, ganttYear))
    .sort((a, b) => {
      const sa = projectDateRange(a).start || "9999-99-99";
      const sb = projectDateRange(b).start || "9999-99-99";
      return sa.localeCompare(sb);
    });
  return `
    <div class="year-nav">
      <button id="prevGanttYearBtn">◀</button>
      <strong>${ganttYear}년</strong>
      <button id="nextGanttYearBtn">▶</button>

    </div>
    ${sortedProjects.map((p) => renderOneGantt(p, ganttYear)).join("") || `<div class="gantt-empty">${ganttYear}년에 표시할 프로젝트가 없습니다.</div>`}`;
}

  return `

      ${filtered.length > LIST_PAGE_SIZE ? `
        <div style="display:flex; align-items:center; gap:12px;">

function bindTabEvents() {
  if (tab === "dashboard") {
    document.getElementById("prevYearBtn").onclick = () => { summaryYear--; render(); };
    document.getElementById("nextYearBtn").onclick = () => { summaryYear++; render(); };
    document.getElementById("exportBtn").onclick = () => exportWeeklyReport();
    document.querySelectorAll(".recent-table tbody tr[data-id]").forEach((r) => r.onclick = () => openEdit(tasks.find((t) => t.id === r.dataset.id)));
    document.getElementById("statusAsOfInput").onchange = (e) => { statusAsOfDate = e.target.value || null; render(); };
    document.getElementById("statusAsOfTodayBtn").onclick = () => { statusAsOfDate = null; render(); };
    {
      const rs = computeRecentImprovementStatus(statusAsOfDate || null);
      document.querySelectorAll(".sd-cell").forEach((cell) => {
        cell.onclick = () => {
          const idx = cell.dataset.rowIdx;
          const kind = cell.dataset.kind;   // "all" | "progress" | "done"
          const row = idx === "cumulative" ? rs.cumulative : rs.rows[Number(idx)];
          if (!row) return;
          let list = row.tasks || [];
          if (kind === "progress") list = list.filter((t) => !isTaskDoneAsOf(t, rs.asOf));
          else if (kind === "done") list = list.filter((t) => isTaskDoneAsOf(t, rs.asOf));
          const kindLabel = kind === "progress" ? "진행" : kind === "done" ? "완료" : "접수(진행+완료)";
          statusDetailPopup = { label: `${row.label} - ${kindLabel}`, tasks: list, asOf: rs.asOf };
          render();
        };
      });
    }
  } else if (tab === "calendar") {
    document.getElementById("prevM").onclick = () => { const d = new Date(ym.year, ym.month - 1, 1); ym = { year: d.getFullYear(), month: d.getMonth() }; render(); };
    document.getElementById("nextM").onclick = () => { const d = new Date(ym.year, ym.month + 1, 1); ym = { year: d.getFullYear(), month: d.getMonth() }; render(); };
    document.getElementById("calBasisFilter").onchange = (e) => { calendarBasis = e.target.value; render(); };
    document.querySelectorAll(".cal-cell").forEach((c) => c.addEventListener("click", (e) => {
      if (e.target.closest(".cal-task")) return;
      openNew(c.dataset.date);
    }));
    document.querySelectorAll(".cal-task").forEach((b) => b.onclick = () => openEdit(tasks.find((t) => t.id === b.dataset.id)));
  } else if (tab === "gantt") {
    document.getElementById("prevGanttYearBtn").onclick = () => { ganttYear--; render(); };
    document.getElementById("nextGanttYearBtn").onclick = () => { ganttYear++; render(); };
    document.getElementById("addProjectBtn").onclick = () => { newProjectModal = true; render(); };
    document.querySelectorAll(".renameProjectBtn").forEach((b) => b.onclick = async () => {
      const project = kpiProjects.find((p) => p.id === b.dataset.project);
      const name = prompt("프로젝트 이름을 수정하세요", project?.name || "");
      if (!name) return;
      await kpiCol.doc(b.dataset.project).update({ name });
    });
    document.querySelectorAll(".deleteProjectBtn").forEach((b) => b.onclick = async () => {
      const project = kpiProjects.find((p) => p.id === b.dataset.project);
      if (!confirm(`"${project?.name || ""}" 프로젝트를 삭제할까요? 안에 있는 단계 일정도 모두 함께 삭제됩니다.`)) return;
      await kpiCol.doc(b.dataset.project).delete();
    });
    let dragState = null;
    document.querySelectorAll(".gantt-row-label").forEach((el) => {
      el.addEventListener("dragstart", (e) => {
        dragState = { projectId: el.dataset.project, fromIdx: Number(el.dataset.idx) };
        e.dataTransfer.effectAllowed = "move";
      });
      el.addEventListener("dragover", (e) => {
        if (!dragState || dragState.projectId !== el.dataset.project) return;
        e.preventDefault();
        el.classList.add("drag-over");
      });
      el.addEventListener("dragleave", () => el.classList.remove("drag-over"));
      el.addEventListener("drop", async (e) => {
        e.preventDefault();
        el.classList.remove("drag-over");
        if (!dragState || dragState.projectId !== el.dataset.project) return;
        const toIdx = Number(el.dataset.idx);
        if (toIdx === dragState.fromIdx) { dragState = null; return; }
        const project = kpiProjects.find((p) => p.id === dragState.projectId);
        const stages = [...(project.stages || [])];
        const [moved] = stages.splice(dragState.fromIdx, 1);
        stages.splice(toIdx, 0, moved);
        await kpiCol.doc(project.id).update({ stages });
        dragState = null;
      });
    });
    document.querySelectorAll(".insertStageBtn").forEach((b) => b.addEventListener("click", async (e) => {
      e.stopPropagation();
      const label = prompt("추가할 단계 이름을 입력하세요", "새 단계");
      if (!label) return;
      const project = kpiProjects.find((p) => p.id === b.dataset.project);
      const stages = [...(project.stages || [])];
      stages.splice(Number(b.dataset.idx) + 1, 0, { label, kpiName: "", start: "", end: "" });
      await kpiCol.doc(project.id).update({ stages });
    }));
    document.querySelectorAll(".gantt-row-label, .gantt-bar").forEach((el) => el.addEventListener("click", (e) => {
      if (e.target.closest(".insertStageBtn")) return;
      openKpiModal(el.dataset.project, Number(el.dataset.idx));
    }));
  } else {
    document.getElementById("addBtn").onclick = () => openNew(fmt(new Date()));
    const kwEl = document.getElementById("kw");
    kwEl.oninput = (e) => {
      listFilter.keyword = e.target.value;
      listPage = 1;
      updateListResultsOnly();
    };
    document.getElementById("statusFilter").onchange = (e) => { listFilter.status = e.target.value; listPage = 1; updateListResultsOnly(); };
    document.getElementById("yearFilter").onchange = (e) => { listYear = e.target.value; listPage = 1; updateListResultsOnly(); };
    document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
    document.getElementById("deleteAllBtn").onclick = () => deleteSelectedTasks();
    document.getElementById("importFile").onchange = (e) => {
      if (e.target.files[0]) handleImportFile(e.target.files[0]);
      e.target.value = "";
    };
    bindListResultEvents();
  }
}

// 목록 탭 결과 영역(체크박스/행 클릭/페이지 이동)만 다시 그리고 이벤트를 다시 붙임.
// 검색창(#kw)이 들어있는 툴바는 절대 건드리지 않으므로, 타이핑 중 IME 조합이 끊길 일이 없음.
function updateListResultsOnly() {
  const wrap = document.getElementById("listResultsWrap");
  if (!wrap) return;
  wrap.innerHTML = renderListResults();
  bindListResultEvents();
}
function bindListResultEvents() {
  const selectAllChk = document.getElementById("selectAllChk");
  if (selectAllChk) selectAllChk.onchange = (e) => {
    document.querySelectorAll(".rowChk").forEach((chk) => {
      if (e.target.checked) selectedTaskIds.add(chk.dataset.id);
      else selectedTaskIds.delete(chk.dataset.id);
    });
    updateListResultsOnly();
  };
  document.querySelectorAll(".rowChk").forEach((chk) => chk.addEventListener("change", (e) => {
    if (e.target.checked) selectedTaskIds.add(chk.dataset.id);
    else selectedTaskIds.delete(chk.dataset.id);
    updateListResultsOnly();
  }));
  const prevPageBtn = document.getElementById("prevListPageBtn");
  const nextPageBtn = document.getElementById("nextListPageBtn");
  if (prevPageBtn) prevPageBtn.onclick = () => { listPage--; updateListResultsOnly(); };
  if (nextPageBtn) nextPageBtn.onclick = () => { listPage++; updateListResultsOnly(); };
  document.querySelectorAll(".sheet tbody tr[data-id]").forEach((r) => r.addEventListener("click", (e) => {
    if (e.target.closest("input")) return;
    openEdit(tasks.find((t) => t.id === r.dataset.id));
  }));
}

/* ===== 간트차트 전용 팝업 ===== */
function bindNewProjectModalEvents() {
  document.getElementById("npBackdrop").addEventListener("click", (e) => { if (e.target.id === "npBackdrop") { newProjectModal = false; render(); } });
  document.getElementById("npCancelBtn").onclick = () => { newProjectModal = false; render(); };
  document.getElementById("npSaveBtn").onclick = async () => {
    const name = document.getElementById("np_name").value.trim() || "새 프로젝트";
    const stages = FIXED_GANTT_ITEMS.map((defaultLabel, idx) => ({
      label: document.getElementById(`np_label_${idx}`).value.trim() || defaultLabel,
      kpiName: "",
      start: document.getElementById(`np_start_${idx}`).value,
      end: document.getElementById(`np_end_${idx}`).value,
    }));
    await kpiCol.add({ name, stages, createdAt: Date.now() });
    newProjectModal = false; render();
  };
}
function openKpiModal(projectId, stageIdx) { kpiModal = { projectId, stageIdx }; render(); }
function closeKpiModal() { kpiModal = null; render(); }
function bindStatusDetailModalEvents() {
  document.getElementById("sdBackdrop").addEventListener("click", (e) => { if (e.target.id === "sdBackdrop") { statusDetailPopup = null; render(); } });
  document.getElementById("sdCloseBtn").onclick = () => { statusDetailPopup = null; render(); };
  document.querySelectorAll(".sd-task-row").forEach((r) => r.onclick = () => {
    const t = tasks.find((x) => x.id === r.dataset.id);
    statusDetailPopup = null;
    if (t) openEdit(t);
    else render();
  });
}
function bindKpiModalEvents() {
  document.getElementById("kpiBackdrop").addEventListener("click", (e) => { if (e.target.id === "kpiBackdrop") closeKpiModal(); });
  document.getElementById("kpiCancelBtn").onclick = closeKpiModal;

  const checkDates = () => {
    const s = document.getElementById("k_start").value;
    const e = document.getElementById("k_end").value;
    const invalid = s && e && e < s;
    document.getElementById("kpiWarning").style.display = invalid ? "block" : "none";
    document.getElementById("kpiSaveBtn").disabled = invalid;
    return invalid;
  };
  document.getElementById("k_start").onchange = checkDates;
  document.getElementById("k_end").onchange = checkDates;

  document.getElementById("kpiClearBtn").onclick = async () => {
    if (!confirm("이 단계를 삭제할까요?")) return;
    const project = kpiProjects.find((p) => p.id === kpiModal.projectId);
    const stages = (project.stages || []).filter((_, i) => i !== kpiModal.stageIdx);
    await kpiCol.doc(project.id).update({ stages });
    kpiModal = null; render();
  };

  document.getElementById("kpiSaveBtn").onclick = async () => {
    if (checkDates()) return;
    const label = document.getElementById("k_label").value.trim();
    if (!label) { alert("단계명을 입력해주세요."); return; }
    const kpiName = document.getElementById("k_kpiName").value.trim();
    const start = document.getElementById("k_start").value;
    const end = document.getElementById("k_end").value;
    const project = kpiProjects.find((p) => p.id === kpiModal.projectId);
    const stages = [...(project.stages || [])];
    stages[kpiModal.stageIdx] = { label, kpiName, start, end };
    await kpiCol.doc(project.id).update({ stages });
    kpiModal = null; render();
  };
}

/* ===== 모달 ===== */
function openNew(date) { modal = { defaultDate: date }; render(); }
async function openEdit(task) {
  if (!task) return;
  const ok = await acquireLock(task);
  modal = { task, lockedBy: ok ? null : (task.editingBy || "다른 사용자") };
  render();
}
function closeModal() {
  if (modal?.task && !modal.lockedBy) releaseLock(modal.task.id);
  modal = null; render();
}

function renderModal() {
  const t = modal.task || {};
  const locked = !!modal.lockedBy;
  const isCustomService = t.service && !SERVICE_TYPES.includes(t.service);
  const isCustomDevDept = t.devDept && !DEV_DEPTS.includes(t.devDept);
  return `
    <div class="modal-backdrop" id="backdrop">
      <div class="modal" id="modalBox">
        <h2>${modal.task ? "일정 수정" : "일정 등록"}</h2>
        ${locked ? `<p class="warning">🔒 ${esc(modal.lockedBy)} 님이 편집 중입니다. 잠시 후 다시 시도하세요.</p>` : ""}
        <fieldset ${locked ? "disabled" : ""} style="border:none; padding:0; margin:0;">
          <label>일정명 *<input id="f_title" value="${esc(t.title || "")}" /></label>

          <h3 class="g-req"><span class="g-tag"></span>기획부서 협의</h3>
          <div class="row">
            <label>요청부서<input id="f_reqDept" value="${esc(t.reqDept || "")}" /></label>
            <label>요청자<input id="f_requester" value="${esc(t.requester || "")}" /></label>
          </div>
          <div class="row">
            <label>요청일자<input type="date" id="f_reqDate" value="${t.reqDate || ""}" /></label>
            <label>요청협의<select id="f_reqMeeting">${MEETING_VALUES.map((v) => `<option ${v === (t.reqMeeting || "없음") ? "selected" : ""}>${v}</option>`).join("")}</select></label>
          </div>
          <label>요청사항<input id="f_reqContent" value="${esc(t.reqContent || "")}" /></label>
          <label>관련 문서번호<input id="f_docNo" value="${esc(t.docNo || "")}" /></label>

          <h3 class="g-dev"><span class="g-tag"></span>개발부서 협의</h3>
          <div class="row">
            <label>서비스 코드<input id="f_serviceCode" value="${t.serviceCode || ""}" /></label>
            <label>서비스명<input id="f_serviceName" value="${esc(t.serviceName || "")}" /></label>
          </div>
          <div class="row">
            <label>서비스구분
              <select id="f_service">${SERVICE_TYPES.map((s) => `<option ${(s === "직접입력" ? isCustomService : s === t.service) ? "selected" : ""}>${s}</option>`).join("")}</select>
            </label>
            <label>개발부서
              <select id="f_devDept">${DEV_DEPTS.map((s) => `<option ${(s === "직접입력" ? isCustomDevDept : s === t.devDept) ? "selected" : ""}>${s}</option>`).join("")}</select>
            </label>
          </div>
          <label id="customServiceWrap" style="display:${isCustomService ? "flex" : "none"};">서비스구분 직접입력<input id="f_serviceCustom" value="${isCustomService ? t.service : ""}" /></label>
          <label id="customDevDeptWrap" style="display:${isCustomDevDept ? "flex" : "none"};">개발부서 직접입력<input id="f_devDeptCustom" value="${isCustomDevDept ? t.devDept : ""}" /></label>
          <div class="row">
            <label>개발협의<select id="f_devMeeting">${MEETING_VALUES.map((v) => `<option ${v === (t.devMeeting || "없음") ? "selected" : ""}>${v}</option>`).join("")}</select></label>
            <label>업무설계<select id="f_workDesign">${MEETING_VALUES.map((v) => `<option ${v === (t.workDesign || "없음") ? "selected" : ""}>${v}</option>`).join("")}</select></label>
            <label>화면설계<select id="f_screenDesign">${MEETING_VALUES.map((v) => `<option ${v === (t.screenDesign || "없음") ? "selected" : ""}>${v}</option>`).join("")}</select></label>
          </div>

          <h3 class="g-sched"><span class="g-tag"></span>개발일정</h3>
          <div class="row">
            <label>CF요청<select id="f_cfRequest">${CF_VALUES.map((v) => `<option ${v === (t.cfRequest || "N") ? "selected" : ""}>${v}</option>`).join("")}</select></label>
            <label>CF번호<input id="f_cfNo" value="${t.cfNo || ""}" /></label>
            <label>CF요청일자<input type="date" id="f_cfDate" value="${t.cfDate || ""}" /></label>
          </div>
          <div class="row">
            <label>협의일자<input type="date" id="f_meetingDate" value="${t.meetingDate || ""}" /></label>
            <label>적용일자<input type="date" id="f_applyDate" value="${t.applyDate || ""}" /></label>
            <label>완료여부<select id="f_status">${STATUS_VALUES.map((v) => `<option ${v === (t.status || (!t.reqDate && !t.applyDate ? "대기중" : "진행")) ? "selected" : ""}>${v}</option>`).join("")}</select></label>
          </div>

          <label>메모<textarea id="f_memo" rows="2">${esc(t.memo || "")}</textarea></label>
        </fieldset>
        <p class="warning" id="dateWarning" style="display:none;">적용일자가 요청일자보다 이전일 수 없습니다.</p>
        <div class="modal-actions">
          ${modal.task ? `<button class="danger" id="deleteBtn" ${locked ? "disabled" : ""}>삭제</button>` : ""}
          <button id="cancelBtn">취소</button>
          <button class="primary" id="saveBtn" ${locked ? "disabled" : ""}>저장</button>
        </div>
      </div>
    </div>`;
}

function bindModalEvents() {
  document.getElementById("backdrop").addEventListener("click", (e) => { if (e.target.id === "backdrop") closeModal(); });
  document.getElementById("cancelBtn").onclick = closeModal;

  document.getElementById("f_service").onchange = (e) => {
    document.getElementById("customServiceWrap").style.display = e.target.value === "직접입력" ? "flex" : "none";
  };
  document.getElementById("f_devDept").onchange = (e) => {
    document.getElementById("customDevDeptWrap").style.display = e.target.value === "직접입력" ? "flex" : "none";
  };

  const checkDates = () => {
    const s = document.getElementById("f_reqDate").value;
    const e = document.getElementById("f_applyDate").value;
    const invalid = s && e && e < s;
    document.getElementById("dateWarning").style.display = invalid ? "block" : "none";
    document.getElementById("saveBtn").disabled = invalid || !!modal.lockedBy;
    return invalid;
  };
  document.getElementById("f_reqDate").onchange = checkDates;
  document.getElementById("f_applyDate").onchange = checkDates;

  if (modal.task) {
    document.getElementById("deleteBtn").onclick = async () => {
      if (confirm("이 일정을 삭제할까요?")) { stopLockHeartbeat(); await tasksCol.doc(modal.task.id).delete(); modal = null; render(); }
    };
  }

  document.getElementById("saveBtn").onclick = async () => {
    if (checkDates()) return;
    const title = document.getElementById("f_title").value.trim();
    if (!title) { alert("일정명을 입력해주세요."); return; }
    const serviceSel = document.getElementById("f_service").value;
    const service = serviceSel === "직접입력" ? (document.getElementById("f_serviceCustom").value.trim() || "직접입력") : serviceSel;
    const devDeptSel = document.getElementById("f_devDept").value;
    const devDept = devDeptSel === "직접입력" ? (document.getElementById("f_devDeptCustom").value.trim() || "직접입력") : devDeptSel;
    const data = {
      title,
      reqDept: document.getElementById("f_reqDept").value,
      requester: document.getElementById("f_requester").value,
      reqDate: document.getElementById("f_reqDate").value,
      reqMeeting: document.getElementById("f_reqMeeting").value,
      reqContent: document.getElementById("f_reqContent").value,
      docNo: document.getElementById("f_docNo").value,
      serviceCode: document.getElementById("f_serviceCode").value,
      service,
      serviceName: document.getElementById("f_serviceName").value,
      devDept,
      devMeeting: document.getElementById("f_devMeeting").value,
      workDesign: document.getElementById("f_workDesign").value,
      screenDesign: document.getElementById("f_screenDesign").value,
      cfRequest: document.getElementById("f_cfRequest").value,
      cfNo: document.getElementById("f_cfNo").value,
      cfDate: document.getElementById("f_cfDate").value,
      meetingDate: document.getElementById("f_meetingDate").value,
      applyDate: document.getElementById("f_applyDate").value,
      status: document.getElementById("f_status").value,
      memo: document.getElementById("f_memo").value,
    };
    // 완료여부는 사용자가 드롭박스에서 선택한 값을 그대로 저장한다 (요청일자/적용일자가 비어있다고 임의로 덮어쓰지 않음)
    if (modal.task) {
      stopLockHeartbeat();
      data.editingBy = firebase.firestore.FieldValue.delete();
      data.editingAt = firebase.firestore.FieldValue.delete();
      await tasksCol.doc(modal.task.id).update(data);
    } else {
      await tasksCol.add(data);
    }
    modal = null; render();
  };
}

/* ===== 스크롤 위치 저장/복원 (새로고침해도 보던 위치 유지) ===== */
window.addEventListener("beforeunload", () => {
  sessionStorage.setItem("scheduler_scroll", String(window.scrollY));
});
window.addEventListener("scroll", () => {
  sessionStorage.setItem("scheduler_scroll", String(window.scrollY));
}, { passive: true });
let scrollRestored = false;
function maybeRestoreScroll() {
  if (scrollRestored) return;
  const y = Number(sessionStorage.getItem("scheduler_scroll") || 0);
  if (y > 0) {
    scrollRestored = true;
    requestAnimationFrame(() => requestAnimationFrame(() => window.scrollTo(0, y)));
  }
}

render();
</script>
</body>
</html>
